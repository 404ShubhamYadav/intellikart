spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/auth/**

            - id: order-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/orders/**

            - id: inventory-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/products/**

server:
  port: 8080

jwt:
  secret: replace-this-with-a-long-random-secret-string-at-least-32-chars